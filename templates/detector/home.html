{% extends 'base.html' %}

{% block content %}
<div class="card">
    <h2 style="text-align: center; margin-bottom: 2rem; color: #333;">上传图片开始识别</h2>

    {% if error %}
    <div style="background: #fee; color: #c33; padding: 1rem; border-radius: 8px; margin: 1rem 0;">
        {{ error }}
    </div>
    {% endif %}
    
    {% if success %}
    <div style="background: #efe; color: #3c3; padding: 1rem; border-radius: 8px; margin: 1rem 0;">
        {{ success }}
    </div>
    {% endif %}

    <form method="POST" action="{% url 'upload' %}" enctype="multipart/form-data" id="uploadForm">
        {% csrf_token %}

        <div class="upload-area" onclick="document.getElementById('imageInput').click()">
            <input type="file" id="imageInput" name="image" accept="image/*" style="display: none;" onchange="previewFile()">
            <div style="font-size: 5rem; margin-bottom: 1rem;">📁</div>
            <h3 style="color: #667eea;">点击选择图片或拖拽到这里</h3>
            <p style="color: #666; margin-top: 1rem;">支持 JPG, PNG 格式，最大 10MB</p>
        </div>

        <div id="preview" style="display: none; margin-top: 2rem; text-align: center;">
            <img id="previewImage" style="max-width: 300px; border-radius: 10px; margin-bottom: 1rem;">
            <p id="fileName"></p>
        </div>

        <div style="text-align: center; margin-top: 2rem;">
            <button type="submit" class="btn" style="padding: 15px 50px; font-size: 1.1rem;">
                🚀 开始识别
            </button>
            <button type="button" class="btn" id="uploadOnlyBtn" style="padding: 15px 50px; font-size: 1.1rem; background: #4ECDC4; margin-left: 1rem;" onclick="uploadOnly()">
                📤 仅上传
            </button>
        </div>
    </form>
</div>

<div class="card">
    <h3> 支持识别的物品</h3>
    <div class="stats-grid">
        <div class="stat-item" data-model="keyboard" onclick="toggleModelSelection(this)"             style="cursor: pointer; transition: all 0.3s ease; border: 2px solid transparent;">
             ⌨️ 键盘
        </div>
        <div class="stat-item" data-model="person" onclick="toggleModelSelection(this)"             style="cursor: pointer; transition: all 0.3s ease; border: 2px solid transparent;">
              🤵 人
        </div>
        <div class="stat-item" data-model="table" onclick="toggleModelSelection(this)"             style="cursor: pointer; transition: all 0.3s ease; border: 2px solid transparent;">
            🛞 桌子
        </div>
        <div class="stat-item" data-model="chair" onclick="toggleModelSelection(this)"             style="cursor: pointer; transition: all 0.3s ease; border: 2px solid transparent;">
            🪑 椅子
        </div>
        <div class="stat-item" data-model="phone" onclick="toggleModelSelection(this)"             style="cursor: pointer; transition: all 0.3s ease; border: 2px solid transparent;">
            📱 手机
        </div>
        <div class="stat-item" data-model="laptop" onclick="toggleModelSelection(this)"             style="cursor: pointer; transition: all 0.3s ease; border: 2px solid transparent;">
            💻 笔记本电脑
        </div>
    </div>
    <p style="margin-top: 1rem; color: #666;" id="modeDescription">系统将用不同颜色标注识别到的物品，并显示置信度</p>
    <p style="margin-top: 0.5rem; color: #667eea; font-weight: bold;" id="selectedModelsText"></p>
</div>

<script>// 存储选中的模型
let selectedModels = [];

function previewFile() {
    const file = document.getElementById('imageInput').files[0];
    const preview = document.getElementById('preview');
    const previewImage = document.getElementById('previewImage');
    const fileName = document.getElementById('fileName');

    if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
            previewImage.src = e.target.result;
            preview.style.display = 'block';
            fileName.textContent = `已选择：${file.name}`;
        }
        reader.readAsDataURL(file);
    }
}

function toggleModelSelection(element) {
    const model = element.dataset.model;
    const modelName = element.textContent.trim();

    // 切换选中状态
    if (selectedModels.includes(model)) {
        selectedModels = selectedModels.filter(m => m !== model);
        element.style.background = '#f0f4ff';
        element.style.color = 'inherit';
        element.style.border = '2px solid transparent';
        element.style.transform = 'scale(1)';
    } else {
        selectedModels.push(model);
        element.style.background = 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)';
        element.style.color = 'white';
        element.style.border = '2px solid #764ba2';
        element.style.transform = 'scale(1.05)';
    }

    // 更新提示文字
    updateSelectedModelsText();
}

function updateSelectedModelsText() {
    const textElement = document.getElementById('selectedModelsText');
    const modeDescription = document.getElementById('modeDescription');
    const submitBtn = document.querySelector('button[type="submit"]');

    if (selectedModels.length === 0) {
        textElement.textContent = '';
        modeDescription.textContent = '系统将用不同颜色标注识别到的物品，并显示置信度';
        modeDescription.style.color = '#666';
        submitBtn.innerHTML = '🚀 开始识别';
    } else if (selectedModels.length === 1) {
        textElement.textContent = `🎯 当前模式：仅检测 ${selectedModels[0]}`;
        modeDescription.textContent = '💡 点击多个物品可选择多模型同时检测';
        modeDescription.style.color = '#667eea';
        submitBtn.innerHTML = `🚀 开始识别（仅${selectedModels[0]}）`;
    } else {
        const modelNames = selectedModels.map(m => {
            const names = {'keyboard': '键盘', 'person': '人', 'table': '桌子',
                          'chair': '椅子', 'phone': '手机', 'laptop': '笔记本电脑'};
            return names[m] || m;
        }).join(',');
        textElement.textContent = `🎯 当前模式：检测 ${modelNames}`;
        modeDescription.textContent = `💡 已选择 ${selectedModels.length} 个模型`;
        modeDescription.style.color = '#667eea';
        submitBtn.innerHTML = `🚀 开始识别（${selectedModels.length}个模型）`;
    }
}

function uploadOnly() {
    const fileInput = document.getElementById('imageInput');
    const file = fileInput.files[0];

    if (!file) {
        alert('请先选择一张图片！');
        return;
    }

    const formData = new FormData();
    formData.append('image', file);

    const btn = document.getElementById('uploadOnlyBtn');
    btn.innerHTML = '⏳ 上传中...';
    btn.disabled = true;

    fetch("{% url 'upload_only' %}", {
        method: 'POST',
        headers: {
            'X-CSRFToken': getCookie('csrftoken')
        },
        body: formData
    })
    .then(response => response.text())
    .then(html => {
        document.open();
        document.write(html);
        document.close();
    })
    .catch(error => {
        console.error('Error:', error);
        alert('上传失败：' + error.message);
        btn.innerHTML = '📤 仅上传';
        btn.disabled = false;
    });
}

// 修改表单提交行为
document.getElementById('uploadForm').addEventListener('submit', function(e) {
    const fileInput = document.getElementById('imageInput');
    const file = fileInput.files[0];

    if (!file) {
        alert('请先选择一张图片！');
        return;
    }

    // 如果有选中的模型，使用 AJAX 提交
    if (selectedModels.length > 0) {
        e.preventDefault();

        const formData = new FormData();
        formData.append('image', file);
        selectedModels.forEach(model => {
            formData.append('selected_models', model);
        });

        const submitBtn = document.querySelector('button[type="submit"]');
        const originalText = submitBtn.innerHTML;
        submitBtn.innerHTML = ' 检测中...';
        submitBtn.disabled = true;

        // 显示加载状态
        const loadingDiv = document.createElement('div');
        loadingDiv.id = 'loadingMessage';
        loadingDiv.style.cssText = 'position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.8); color: white; padding: 2rem; border-radius: 10px; z-index: 9999;';

        if (selectedModels.length === 1) {
            loadingDiv.innerHTML = `⏳ 正在检测${selectedModels[0]}...`;
        } else {
            loadingDiv.innerHTML = `⏳ 正在检测 ${selectedModels.length} 个模型...`;
        }
        document.body.appendChild(loadingDiv);

        fetch("{% url 'upload' %}", {
            method: 'POST',
            headers: {
                'X-CSRFToken': getCookie('csrftoken')
            },
            body: formData
        })
        .then(response => {
            if (response.ok) {
                return response.text();
            } else {
                return response.text().then(text => {
                    throw new Error(text || '检测失败');
                });
            }
        })
        .then(html => {
            // 移除加载提示
            if (document.getElementById('loadingMessage')) {
                document.getElementById('loadingMessage').remove();
            }
            // 直接替换当前页面内容为结果页面
            document.open();
            document.write(html);
            document.close();
        })
        .catch(error => {
            console.error('Error:', error);
            // 移除加载提示
            if (document.getElementById('loadingMessage')) {
                document.getElementById('loadingMessage').remove();
            }
            alert('检测失败：' + error.message + '，请重试');
            submitBtn.innerHTML = originalText;
            submitBtn.disabled = false;
        });
    }
    // 如果没有选中的模型，正常提交表单（使用所有模型）
});

function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = cookies.length - 1; i >= 0; i--) {
            let cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}

// 确保 CSRF token 可用
document.addEventListener('DOMContentLoaded', function() {
    const csrfToken = getCookie('csrftoken');
    if (!csrfToken) {
        console.warn('CSRF token not found in cookies');
    } else {
        console.log('CSRF token loaded successfully');
    }
});
</script>
{% endblock %}
