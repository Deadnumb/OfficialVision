{% extends 'base.html' %}

{% block content %}
<div class="card">
    <h2 style="text-align:center;">上传图片进行物品识别</h2>
    <form method="post" enctype="multipart/form-data" style="text-align:center; margin-top:20px;">
        {% csrf_token %}
        <input type="file" name="image" accept="image/*" required>
        <button type="submit" class="btn" style="margin-top:10px;">开始识别</button>
    </form>
</div>
{% endblock %}
